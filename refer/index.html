<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H Anime Hub — Refer</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#0f0f1a;
    color:#fff;
    font-family:'Segoe UI',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    text-align:center;
    padding:20px;
  }
  .card{
    background:linear-gradient(135deg,#1a1a2e,#16213e);
    border:1px solid #e91e8c33;
    border-radius:24px;
    padding:40px 30px;
    max-width:380px;
    width:100%;
    box-shadow:0 0 40px #e91e8c22;
  }
  .logo{font-size:48px;margin-bottom:16px}
  h1{font-size:22px;color:#e91e8c;margin-bottom:8px}
  .sub{font-size:14px;color:#aaa;margin-bottom:32px}
  .status-box{
    background:#ffffff0d;
    border-radius:16px;
    padding:24px;
    margin-bottom:24px;
  }
  .spinner{
    width:48px;height:48px;
    border:4px solid #ffffff22;
    border-top:4px solid #e91e8c;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    margin:0 auto 16px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .status-text{font-size:16px;color:#fff;margin-bottom:8px}
  .status-sub{font-size:13px;color:#888}
  .success-icon{font-size:48px;margin-bottom:12px;display:none}
  .success-text{font-size:18px;color:#4caf50;font-weight:600;display:none}
  .success-sub{font-size:13px;color:#aaa;margin-top:6px;display:none}
  .earn-badge{
    background:linear-gradient(135deg,#e91e8c,#9c27b0);
    border-radius:12px;
    padding:12px 20px;
    font-size:15px;
    font-weight:600;
    margin-top:16px;
    display:none;
  }
  .open-btn{
    display:none;
    width:100%;
    padding:14px;
    background:linear-gradient(135deg,#e91e8c,#9c27b0);
    border:none;
    border-radius:14px;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    text-decoration:none;
    margin-top:8px;
  }
  .error-text{font-size:16px;color:#f44336;display:none}
  .footer{font-size:12px;color:#555;margin-top:24px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🎌</div>
  <h1>H Anime Hub</h1>
  <p class="sub">Watch Anime & Earn Daily</p>

  <div class="status-box">
    <div class="spinner" id="spinner"></div>
    <div class="status-text" id="statusText">Processing refer...</div>
    <div class="status-sub" id="statusSub">Please wait a moment</div>

    <div class="success-icon" id="successIcon">✅</div>
    <div class="success-text" id="successText">Refer Successful!</div>
    <div class="success-sub" id="successSub">Opening Mini App...</div>
    <div class="earn-badge" id="earnBadge">+₹0.30 Added to Wallet 💰</div>

    <div class="error-text" id="errorText"></div>
  </div>

  <a class="open-btn" id="openBtn" href="https://t.me/H_Anime_Hub777_Bot/app">
    🎌 Open H Anime Hub
  </a>

  <div class="footer">H Anime Hub • Daily Refer Earn System</div>
</div>

<script>
// ── Firebase Config ──
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyCpnVJVXlNf2dE6p1Bw522Xh2n62bx5LVw",
  authDomain:        "anime-world-7d366.firebaseapp.com",
  projectId:         "anime-world-7d366",
  storageBucket:     "anime-world-7d366.firebasestorage.app",
  messagingSenderId: "899881462279",
  appId:             "1:899881462279:web:db1d08aeac7ec5be6c18a2"
};
const MINI_APP_URL   = "https://t.me/H_Anime_Hub777_Bot/app";
const EARN_PER_REFER = 0.30;

// ── Helpers ──
function el(id){ return document.getElementById(id); }

function getDayKey(){
  const now = new Date();
  const ist = new Date(now.getTime() + (5.5*60*60*1000) - (now.getTimezoneOffset()*60*1000));
  return ist.toISOString().slice(0,10);
}

function getUID(){
  // Generate a unique ID for this browser session stored in localStorage
  let uid = localStorage.getItem("hah_clicker_uid");
  if(!uid){
    uid = "web_" + Math.random().toString(36).slice(2,10) + "_" + Date.now().toString(36);
    localStorage.setItem("hah_clicker_uid", uid);
  }
  return uid;
}

function showSuccess(){
  el("spinner").style.display      = "none";
  el("statusText").style.display   = "none";
  el("statusSub").style.display    = "none";
  el("successIcon").style.display  = "block";
  el("successText").style.display  = "block";
  el("successSub").style.display   = "block";
  el("earnBadge").style.display    = "block";
  el("openBtn").style.display      = "block";
}

function showAlready(){
  el("spinner").style.display    = "none";
  el("statusText").textContent   = "Already Referred Today!";
  el("statusSub").textContent    = "Come back tomorrow for more earnings";
  el("openBtn").style.display    = "block";
}

function showError(msg){
  el("spinner").style.display    = "none";
  el("statusText").style.display = "none";
  el("statusSub").style.display  = "none";
  el("errorText").textContent    = msg;
  el("errorText").style.display  = "block";
  el("openBtn").style.display    = "block";
}

// ── Main Refer Logic ──
async function processRefer(){
  // Get ref param from URL
  const params = new URLSearchParams(window.location.search);
  const ref    = params.get("ref");

  if(!ref){
    showError("❌ Invalid refer link");
    return;
  }

  const refUID  = ref; // referrer's UID e.g. tg_12345
  const byUID   = getUID(); // clicker's UID
  const dayKey  = getDayKey();
  const apiKey  = FIREBASE_CONFIG.apiKey;
  const project = FIREBASE_CONFIG.projectId;
  const base    = `https://firestore.googleapis.com/v1/projects/${project}/databases/(default)/documents`;

  // Self-refer check (basic)
  if(refUID === byUID){
    showError("❌ Self-refer not allowed");
    return;
  }

  try{
    // Get current refer doc
    const getRes  = await fetch(`${base}/refers/${refUID}?key=${apiKey}`);
    const getData = getRes.ok ? await getRes.json() : {};
    const fields  = getData.fields || {};

    // Check already referred today
    const byMap    = (fields.byUID?.mapValue?.fields || {});
    const todayArr = (byMap[dayKey]?.arrayValue?.values || []).map(v => v.stringValue);

    if(todayArr.includes(byUID)){
      showAlready();
      // Still redirect after 3s
      setTimeout(()=>{ window.location.href = MINI_APP_URL; }, 3000);
      return;
    }

    todayArr.push(byUID);

    // Current values
    const cur = {
      totalRefers: parseInt(fields.totalRefers?.integerValue  || 0),
      todayRefers: parseInt(fields.todayRefers?.integerValue  || 0),
      balance:     parseFloat(fields.balance?.doubleValue     || fields.balance?.integerValue     || 0),
      totalEarned: parseFloat(fields.totalEarned?.doubleValue || fields.totalEarned?.integerValue || 0),
      todayEarned: parseFloat(fields.todayEarned?.doubleValue || fields.todayEarned?.integerValue || 0),
    };

    // New values
    const newFields = {
      totalRefers: { integerValue: String(cur.totalRefers + 1) },
      todayRefers: { integerValue: String(cur.todayRefers + 1) },
      balance:     { doubleValue:  +(cur.balance     + EARN_PER_REFER).toFixed(2) },
      totalEarned: { doubleValue:  +(cur.totalEarned + EARN_PER_REFER).toFixed(2) },
      todayEarned: { doubleValue:  +(cur.todayEarned + EARN_PER_REFER).toFixed(2) },
      byUID: { mapValue: { fields: {
        ...byMap,
        [dayKey]: { arrayValue: { values: todayArr.map(u=>({stringValue:u})) }}
      }}}
    };

    // Write to Firebase
    let writeRes;
    if(getRes.ok && fields.totalRefers){
      // Update existing doc
      const masks = Object.keys(newFields).map(f=>`updateMask.fieldPaths=${f}`).join("&");
      writeRes = await fetch(`${base}/refers/${refUID}?key=${apiKey}&${masks}`, {
        method: "PATCH",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({fields: newFields})
      });
    } else {
      // Create new doc
      writeRes = await fetch(`${base}/refers?key=${apiKey}&documentId=${refUID}`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({fields: newFields})
      });
    }

    if(writeRes.ok || writeRes.status === 200){
      showSuccess();
      // Auto redirect to mini app after 2.5s
      setTimeout(()=>{ window.location.href = MINI_APP_URL; }, 2500);
    } else {
      showError("❌ Something went wrong. Try again.");
      el("openBtn").style.display = "block";
    }

  } catch(e){
    showError("❌ Network error. Check connection.");
    el("openBtn").style.display = "block";
  }
}

// Run on page load
processRefer();
</script>
</body>
</html>
